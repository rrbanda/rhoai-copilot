# Gitleaks custom configuration for rhoai-copilot.
# Extends default rules with patterns that catch credential leaks
# specific to OpenShift/RHOAI agent workflows.

[extend]
useDefault = true

[[rules]]
id = "password-assignment"
description = "Password value assigned near a password keyword"
regex = '''(?i)(password|passwd|pwd|pass)\s*[=:|]\s*['"]?[A-Za-z0-9+/=_\-]{8,}['"]?'''
keywords = ["password", "passwd", "pwd", "pass"]

[[rules]]
id = "base64-credential"
description = "Base64-encoded credential value in a config or docs file"
regex = '''(?i)(password|token|secret|credential|api[_-]?key)\s*[=:|]\s*['"]?[A-Za-z0-9+/=]{12,}['"]?'''
keywords = ["password", "token", "secret", "credential", "apikey", "api_key"]

[[rules]]
id = "oc-login-password"
description = "oc login command with inline password"
regex = '''oc\s+login\s+.*-p\s+['"]?[^\s'"]+['"]?\s+https?://'''
keywords = ["oc login"]

[[rules]]
id = "cluster-api-with-auth"
description = "Cluster API URL with embedded credentials"
regex = '''https?://[^:]+:[^@]+@api\.[a-z0-9\-]+\.[a-z0-9]+'''
keywords = ["api."]

[[rules]]
id = "registry-password"
description = "Container registry password in commands or configs"
regex = '''(?i)(registry.password|MIRROR_REGISTRY_PASSWORD)\s*[=:]\s*['"]?[^\s'"]{8,}['"]?'''
keywords = ["registry_password", "MIRROR_REGISTRY_PASSWORD", "registry.password"]

[allowlist]
description = "Global allowlist"
paths = [
  '''\.gitleaks\.toml$''',
  '''examples/disconnected/.*\.yaml$''',
]
regexTarget = "line"
regexes = [
  '''<PLACEHOLDER>''',
  '''<MIRROR_CA_PEM>''',
  '''<MIRRORED_CATALOG_NAME>''',
  '''<YOUR_.*>''',
  '''ghp_YOUR_TOKEN''',
  '''YOUR_KEY''',
  '''YOUR_TOKEN''',
  '''YOUR_PASSWORD''',
]
