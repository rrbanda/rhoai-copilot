apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshift-mcp-server
  namespace: ocp-mcp-server
  labels:
    app.kubernetes.io/part-of: rhoai-copilot
spec:
  podSelector:
    matchLabels:
      app: openshift-mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: rhoai-copilot
          podSelector:
            matchLabels:
              app: rhoai-copilot
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
