apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhoai-copilot
  labels:
    app: rhoai-copilot
    app.kubernetes.io/name: rhoai-copilot
    app.kubernetes.io/part-of: rhoai-copilot
    app.kubernetes.io/runtime: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rhoai-copilot
  template:
    metadata:
      labels:
        app: rhoai-copilot
        app.kubernetes.io/runtime: hermes
    spec:
      serviceAccountName: rhoai-copilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: quay.io/rbrhssa/rhoai-copilot:latest  # Override with your registry
          imagePullPolicy: Always
          command: ["/bin/bash", "/mnt/entrypoint/entrypoint.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: HOME
              value: /tmp/work
            - name: HERMES_HOME
              value: /tmp/work/.hermes
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: gemini-api-key
            - name: ARGOCD_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: argocd-base-url
                  optional: true
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: argocd-api-token
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: dashboard-password
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: github-token
                  optional: true
            - name: OPENSHIFT_MCP_URL
              value: "http://openshift-mcp-server.ocp-mcp-server.svc.cluster.local:8080/mcp"
            - name: MLFLOW_MCP_URL
              value: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
            - name: PATH
              value: "/sandbox/.venv/bin:/usr/local/bin:/tmp/work/.local/bin:/usr/bin:/bin"
            - name: VIRTUAL_ENV
              value: "/sandbox/.venv"
          ports:
            - containerPort: 18789
              name: dashboard
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: entrypoint
              mountPath: /mnt/entrypoint
            - name: soul
              mountPath: /mnt/soul
            - name: config
              mountPath: /mnt/config
            - name: agent-data
              mountPath: /persistent
            - name: tmp
              mountPath: /tmp
            # Skill mounts
            - name: skill-rhoai-disconnected-deploy
              mountPath: /mnt/skill-rhoai-disconnected-deploy
            - name: skill-rhoai-disconnected-helper
              mountPath: /mnt/skill-rhoai-disconnected-helper
            - name: skill-rhoai-install-validator
              mountPath: /mnt/skill-rhoai-install-validator
            - name: skill-gitops-config-generator
              mountPath: /mnt/skill-gitops-config-generator
            - name: skill-capacity-forecaster
              mountPath: /mnt/skill-capacity-forecaster
            - name: skill-serving-runtime-advisor
              mountPath: /mnt/skill-serving-runtime-advisor
            - name: skill-training-planner
              mountPath: /mnt/skill-training-planner
            - name: skill-rhoai-dsc-inspector
              mountPath: /mnt/skill-rhoai-dsc-inspector
            - name: skill-rhoai-platform-status
              mountPath: /mnt/skill-rhoai-platform-status
            - name: skill-rhoai-upgrade-advisor
              mountPath: /mnt/skill-rhoai-upgrade-advisor
            - name: skill-experiment-tracker
              mountPath: /mnt/skill-experiment-tracker
            - name: skill-workbench-troubleshooter
              mountPath: /mnt/skill-workbench-troubleshooter
            - name: skill-pipeline-debugger
              mountPath: /mnt/skill-pipeline-debugger
            - name: skill-model-promotion-workflow
              mountPath: /mnt/skill-model-promotion-workflow
            - name: skill-rhoai-model-lifecycle
              mountPath: /mnt/skill-rhoai-model-lifecycle
            - name: skill-maas-enable
              mountPath: /mnt/skill-maas-enable
            - name: skill-maas-deploy-model
              mountPath: /mnt/skill-maas-deploy-model
            - name: skill-argocd-health-check
              mountPath: /mnt/skill-argocd-health-check
            - name: skill-argocd-diagnose-sync
              mountPath: /mnt/skill-argocd-diagnose-sync
            - name: skill-daily-report-generator
              mountPath: /mnt/skill-daily-report-generator
            - name: skill-incident-runbook
              mountPath: /mnt/skill-incident-runbook
            - name: skill-maas-debug
              mountPath: /mnt/skill-maas-debug
      volumes:
        - name: entrypoint
          configMap:
            name: rhoai-copilot-entrypoint
            defaultMode: 0755
        - name: soul
          configMap:
            name: rhoai-copilot-soul
        - name: config
          configMap:
            name: rhoai-copilot-config
        - name: agent-data
          persistentVolumeClaim:
            claimName: rhoai-copilot-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        # Skill volumes
        - name: skill-rhoai-disconnected-deploy
          configMap:
            name: skill-rhoai-disconnected-deploy
        - name: skill-rhoai-disconnected-helper
          configMap:
            name: skill-rhoai-disconnected-helper
        - name: skill-rhoai-install-validator
          configMap:
            name: skill-rhoai-install-validator
        - name: skill-gitops-config-generator
          configMap:
            name: skill-gitops-config-generator
        - name: skill-capacity-forecaster
          configMap:
            name: skill-capacity-forecaster
        - name: skill-serving-runtime-advisor
          configMap:
            name: skill-serving-runtime-advisor
        - name: skill-training-planner
          configMap:
            name: skill-training-planner
        - name: skill-rhoai-dsc-inspector
          configMap:
            name: skill-rhoai-dsc-inspector
        - name: skill-rhoai-platform-status
          configMap:
            name: skill-rhoai-platform-status
        - name: skill-rhoai-upgrade-advisor
          configMap:
            name: skill-rhoai-upgrade-advisor
        - name: skill-experiment-tracker
          configMap:
            name: skill-experiment-tracker
        - name: skill-workbench-troubleshooter
          configMap:
            name: skill-workbench-troubleshooter
        - name: skill-pipeline-debugger
          configMap:
            name: skill-pipeline-debugger
        - name: skill-model-promotion-workflow
          configMap:
            name: skill-model-promotion-workflow
        - name: skill-rhoai-model-lifecycle
          configMap:
            name: skill-rhoai-model-lifecycle
        - name: skill-maas-enable
          configMap:
            name: skill-maas-enable
        - name: skill-maas-deploy-model
          configMap:
            name: skill-maas-deploy-model
        - name: skill-argocd-health-check
          configMap:
            name: skill-argocd-health-check
        - name: skill-argocd-diagnose-sync
          configMap:
            name: skill-argocd-diagnose-sync
        - name: skill-daily-report-generator
          configMap:
            name: skill-daily-report-generator
        - name: skill-incident-runbook
          configMap:
            name: skill-incident-runbook
        - name: skill-maas-debug
          configMap:
            name: skill-maas-debug
