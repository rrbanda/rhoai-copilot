        - name: skill-rhoai-disconnected-deploy
          configMap:
            name: skill-rhoai-disconnected-deploy
        - name: skill-rhoai-disconnected-helper
          configMap:
            name: skill-rhoai-disconnected-helper
        - name: skill-rhoai-install-validator
          configMap:
            name: skill-rhoai-install-validator
        - name: skill-gitops-config-generator
          configMap:
            name: skill-gitops-config-generator
        - name: skill-capacity-forecaster
          configMap:
            name: skill-capacity-forecaster
        - name: skill-serving-runtime-advisor
          configMap:
            name: skill-serving-runtime-advisor
        - name: skill-training-planner
          configMap:
            name: skill-training-planner
        - name: skill-rhoai-dsc-inspector
          configMap:
            name: skill-rhoai-dsc-inspector
        - name: skill-rhoai-platform-status
          configMap:
            name: skill-rhoai-platform-status
        - name: skill-rhoai-upgrade-advisor
          configMap:
            name: skill-rhoai-upgrade-advisor
        - name: skill-experiment-tracker
          configMap:
            name: skill-experiment-tracker
        - name: skill-workbench-troubleshooter
          configMap:
            name: skill-workbench-troubleshooter
        - name: skill-pipeline-debugger
          configMap:
            name: skill-pipeline-debugger
        - name: skill-model-promotion-workflow
          configMap:
            name: skill-model-promotion-workflow
        - name: skill-rhoai-model-lifecycle
          configMap:
            name: skill-rhoai-model-lifecycle
        - name: skill-maas-enable
          configMap:
            name: skill-maas-enable
        - name: skill-maas-deploy-model
          configMap:
            name: skill-maas-deploy-model
        - name: skill-argocd-health-check
