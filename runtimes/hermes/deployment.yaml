apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhoai-copilot
  labels:
    app: rhoai-copilot
    app.kubernetes.io/name: rhoai-copilot
    app.kubernetes.io/part-of: rhoai-copilot
    app.kubernetes.io/runtime: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rhoai-copilot
  template:
    metadata:
      labels:
        app: rhoai-copilot
        app.kubernetes.io/runtime: hermes
    spec:
      serviceAccountName: rhoai-copilot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: quay.io/rbrhssa/rhoai-copilot:latest  # Override with your registry
          imagePullPolicy: Always
          command: ["/bin/bash", "/mnt/entrypoint/entrypoint.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: HOME
              value: /tmp/work
            - name: HERMES_HOME
              value: /tmp/work/.hermes
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: gemini-api-key
            - name: ARGOCD_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: argocd-base-url
                  optional: true
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: argocd-api-token
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: dashboard-password
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhoai-copilot-secrets
                  key: github-token
                  optional: true
            - name: OPENSHIFT_MCP_URL
              value: "http://openshift-mcp-server.ocp-mcp-server.svc.cluster.local:8080/mcp"
            - name: MLFLOW_MCP_URL
              value: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
            - name: PATH
              value: "/sandbox/.venv/bin:/usr/local/bin:/tmp/work/.local/bin:/usr/bin:/bin"
            - name: VIRTUAL_ENV
              value: "/sandbox/.venv"
          ports:
            - containerPort: 18789
              name: dashboard
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: entrypoint
              mountPath: /mnt/entrypoint
            - name: soul
              mountPath: /mnt/soul
            - name: config
              mountPath: /mnt/config
            - name: agent-data
              mountPath: /persistent
            - name: tmp
              mountPath: /tmp
            # Skill mounts
            - name: skill-rhoai-connected-deploy
              mountPath: /mnt/skill-rhoai-connected-deploy
            - name: skill-gitops-repo-scaffold
              mountPath: /mnt/skill-gitops-repo-scaffold
            - name: skill-rhoai-disconnected-deploy
              mountPath: /mnt/skill-rhoai-disconnected-deploy
            - name: skill-rhoai-disconnected-helper
              mountPath: /mnt/skill-rhoai-disconnected-helper
            - name: skill-rhoai-install-validator
              mountPath: /mnt/skill-rhoai-install-validator
            - name: skill-gitops-config-generator
              mountPath: /mnt/skill-gitops-config-generator
            - name: skill-capacity-forecaster
              mountPath: /mnt/skill-capacity-forecaster
            - name: skill-serving-runtime-advisor
              mountPath: /mnt/skill-serving-runtime-advisor
            - name: skill-training-planner
              mountPath: /mnt/skill-training-planner
            - name: skill-rhoai-dsc-inspector
              mountPath: /mnt/skill-rhoai-dsc-inspector
            - name: skill-rhoai-platform-status
              mountPath: /mnt/skill-rhoai-platform-status
            - name: skill-rhoai-upgrade-advisor
              mountPath: /mnt/skill-rhoai-upgrade-advisor
            - name: skill-experiment-tracker
              mountPath: /mnt/skill-experiment-tracker
            - name: skill-workbench-troubleshooter
              mountPath: /mnt/skill-workbench-troubleshooter
            - name: skill-pipeline-debugger
              mountPath: /mnt/skill-pipeline-debugger
            - name: skill-model-promotion-workflow
              mountPath: /mnt/skill-model-promotion-workflow
            - name: skill-rhoai-model-lifecycle
              mountPath: /mnt/skill-rhoai-model-lifecycle
            - name: skill-maas-enable
              mountPath: /mnt/skill-maas-enable
            - name: skill-maas-deploy-model
              mountPath: /mnt/skill-maas-deploy-model
            - name: skill-argocd-health-check
              mountPath: /mnt/skill-argocd-health-check
            - name: skill-argocd-diagnose-sync
              mountPath: /mnt/skill-argocd-diagnose-sync
            - name: skill-daily-report-generator
              mountPath: /mnt/skill-daily-report-generator
            - name: skill-incident-runbook
              mountPath: /mnt/skill-incident-runbook
            - name: skill-maas-debug
              mountPath: /mnt/skill-maas-debug
            # New skills — Plan
            - name: skill-model-catalog-advisor
              mountPath: /mnt/skill-model-catalog-advisor
            # New skills — Administer
            - name: skill-kueue-quota-manager
              mountPath: /mnt/skill-kueue-quota-manager
            - name: skill-hardware-profile-manager
              mountPath: /mnt/skill-hardware-profile-manager
            - name: skill-feature-store-setup
              mountPath: /mnt/skill-feature-store-setup
            # New skills — Develop
            - name: skill-model-registry-manager
              mountPath: /mnt/skill-model-registry-manager
            - name: skill-workbench-provisioner
              mountPath: /mnt/skill-workbench-provisioner
            - name: skill-ogx-rag-builder
              mountPath: /mnt/skill-ogx-rag-builder
            - name: skill-autorag-optimizer
              mountPath: /mnt/skill-autorag-optimizer
            - name: skill-genai-playground-guide
              mountPath: /mnt/skill-genai-playground-guide
            # New skills — Train
            - name: skill-distributed-training-setup
              mountPath: /mnt/skill-distributed-training-setup
            - name: skill-automl-trainer
              mountPath: /mnt/skill-automl-trainer
            # New skills — Evaluate
            - name: skill-lm-eval-runner
              mountPath: /mnt/skill-lm-eval-runner
            # New skills — Deploy
            - name: skill-llmd-deployment-manager
              mountPath: /mnt/skill-llmd-deployment-manager
            - name: skill-kserve-model-deployer
              mountPath: /mnt/skill-kserve-model-deployer
            - name: skill-maas-subscription-manager
              mountPath: /mnt/skill-maas-subscription-manager
            - name: skill-maas-external-models
              mountPath: /mnt/skill-maas-external-models
            # New skills — Monitor
            - name: skill-model-drift-monitor
              mountPath: /mnt/skill-model-drift-monitor
            # New skills — Maintain Safety
            - name: skill-nemo-guardrails-configurator
              mountPath: /mnt/skill-nemo-guardrails-configurator
            - name: skill-garak-security-scanner
              mountPath: /mnt/skill-garak-security-scanner
      volumes:
        - name: entrypoint
          configMap:
            name: rhoai-copilot-entrypoint
            defaultMode: 0755
        - name: soul
          configMap:
            name: rhoai-copilot-soul
        - name: config
          configMap:
            name: rhoai-copilot-config
        - name: agent-data
          persistentVolumeClaim:
            claimName: rhoai-copilot-data
        - name: tmp
