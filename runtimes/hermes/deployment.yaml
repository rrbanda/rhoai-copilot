        - name: skill-genai-playground-guide
          configMap:
            name: skill-genai-playground-guide
        # New skill volumes — Train
        - name: skill-distributed-training-setup
          configMap:
            name: skill-distributed-training-setup
        - name: skill-automl-trainer
          configMap:
            name: skill-automl-trainer
        # New skill volumes — Evaluate
        - name: skill-lm-eval-runner
          configMap:
