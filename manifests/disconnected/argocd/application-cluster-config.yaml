# ArgoCD Application for cluster mirror configuration.
# Sync-wave 0: applied FIRST — disables default catalogs, trusts mirror CA,
# creates the redhat-operators alias.
#
# NOTE: IDMS, ITMS, and CatalogSources from oc-mirror output are NOT in this
# Application — they are generated by oc-mirror and must be applied manually
# with `oc apply -f` because they are environment-specific output, not templates.
#
# BEFORE USING:
# 1. Replace <YOUR_GITOPS_REPO_URL> and <YOUR_BRANCH>
# 2. Fill in placeholders in cluster-config/ templates first
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-cluster-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: <YOUR_GITOPS_REPO_URL>
    targetRevision: <YOUR_BRANCH>
    path: manifests/disconnected/cluster-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
