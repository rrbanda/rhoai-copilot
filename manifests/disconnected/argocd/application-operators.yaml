# ArgoCD Application for RHOAI dependency operators.
# Sync-wave 1: installs cert-manager, OSSM 3, NFD, GPU operator, RHOAI operator.
#
# CRITICAL SETTINGS:
# - ServerSideApply=true: required for operator CRDs
# - SkipDryRunOnMissingResource=true: CRDs don't exist until operators install
# - RespectIgnoreDifferences=true: operators mutate their own resources
#
# BEFORE USING:
# 1. Replace <YOUR_GITOPS_REPO_URL> with your deployment repo URL
# 2. Replace <YOUR_BRANCH> with your target branch
# 3. Ensure the operators/ directory in your repo has placeholders filled in
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: <YOUR_GITOPS_REPO_URL>
    targetRevision: <YOUR_BRANCH>
    path: manifests/disconnected/operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
