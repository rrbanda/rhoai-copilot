# cert-manager — hard prerequisite for RHOAI 3.x.
# The DSC will not reconcile without it.
#
# BEFORE USING: Replace <MIRRORED_CATALOG_NAME> with your CatalogSource name
# (run: oc get catalogsource -n openshift-marketplace)
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator-og
  namespace: cert-manager-operator
spec:
  targetNamespaces:
    - cert-manager-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: openshift-cert-manager-operator
  channel: stable-v1
  source: <MIRRORED_CATALOG_NAME>
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
