# Red Hat OpenShift AI operator.
# Install AFTER cert-manager and servicemesh3/Istio are Succeeded.
#
# NOTE: The OperatorGroup uses spec: {} (AllNamespaces mode).
# This is different from the dependency operators which scope to their own namespace.
#
# BEFORE USING: Replace <MIRRORED_CATALOG_NAME>, <RHOAI_CHANNEL>, <RHOAI_VERSION>
---
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: redhat-ods-operator-og
  namespace: redhat-ods-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: rhods-operator
  channel: <RHOAI_CHANNEL>
  source: <MIRRORED_CATALOG_NAME>
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  startingCSV: rhods-operator.<RHOAI_VERSION>
