name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill format
        run: |
          echo "Validating skill files..."
          errors=0
          for skill in $(find skills -name "SKILL.md" -not -path "skills/_template/*"); do
            # Must have YAML frontmatter with name and description
            if ! head -1 "$skill" | grep -q "^---"; then
              echo "ERROR: $skill missing YAML frontmatter (must start with ---)"
              errors=$((errors + 1))
            fi
            if ! grep -q "^name:\|^skill:" "$skill"; then
              echo "ERROR: $skill missing 'name:' or 'skill:' in frontmatter"
              errors=$((errors + 1))
            fi
            if ! grep -q "^description:" "$skill"; then
              echo "ERROR: $skill missing 'description:' in frontmatter"
              errors=$((errors + 1))
            fi
            # Must have a procedure or step-by-step section
            if ! grep -qi "## .*procedure\|## .*steps\|## .*step-by-step\|## .*automation\|## .*step 1\|## .*phase [0-9]" "$skill"; then
              echo "ERROR: $skill missing procedure/steps section"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors validation errors"
            exit 1
          fi
          echo "All $( find skills -name 'SKILL.md' -not -path 'skills/_template/*' | wc -l ) skills valid"

  validate-kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate base kustomization
        run: kustomize build runtimes/base/ > /dev/null

      - name: Validate disconnected operator templates
        run: |
          echo "Validating disconnected manifest Kustomize structure..."
          kustomize build manifests/disconnected/operators/ > /dev/null
          kustomize build manifests/disconnected/rhoai/ > /dev/null
          kustomize build manifests/disconnected/cluster-config/ > /dev/null
          echo "All disconnected template directories valid"

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            agent/config.yaml \
            workflows/*.yaml \
            eval/scenarios/*.yaml

  validate-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify eval scenario format
        run: |
          echo "Validating eval scenarios..."
          errors=0
          for scenario in eval/scenarios/*.yaml; do
            [ "$(basename "$scenario")" = "_template.yaml" ] && continue
            for field in name description persona phase input expected_behavior safety_check scoring; do
              if ! grep -q "^${field}:" "$scenario"; then
                echo "ERROR: $scenario missing required field '${field}'"
                errors=$((errors + 1))
              fi
            done
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors eval scenario errors"
            exit 1
          fi
          count=$(find eval/scenarios -name "*.yaml" ! -name "_template.yaml" | wc -l)
          echo "All $count eval scenarios valid"

      - name: Verify eval coverage
        run: |
          python3 -c "
          import yaml, os
          skills = set()
          for f in os.listdir('skills'):
              p = os.path.join('skills', f)
              if os.path.isdir(p):
                  for sf in os.listdir(p):
                      sp = os.path.join(p, sf, 'SKILL.md')
                      if os.path.isfile(sp):
                          skills.add(sf)
          tested = set()
          for f in os.listdir('eval/scenarios'):
              if f.startswith('_') or not f.endswith('.yaml'): continue
              with open(os.path.join('eval/scenarios', f)) as fh:
                  d = yaml.safe_load(fh)
              if d and d.get('skill'):
                  tested.add(d['skill'])
          untested = skills - tested
          coverage = len(tested) / max(len(skills), 1) * 100
          print(f'Skill eval coverage: {len(tested)}/{len(skills)} ({coverage:.0f}%)')
          if untested:
              print(f'Skills without eval: {sorted(untested)}')
          if coverage < 50:
              print(f'WARNING: Coverage below 50% threshold')
          "

      - name: Run eval report generation
        run: python3 eval/run_eval.py --list
